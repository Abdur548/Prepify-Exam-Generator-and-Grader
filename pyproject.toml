[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coursegen"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pymupdf",
    "python-pptx",
    # Imported by ingest/parse.py::_parse_docx. New dependency, explicitly authorised.
    "python-docx",
    # Imported directly by ingest/embed.py. Declared, not added: it was already
    # installed as a transitive dependency of FlagEmbedding, so nothing changes
    # about what gets installed — only that the import is now honestly declared.
    "numpy",
    # Imported by app/preflight.py to check the model cache without a network call.
    # Declared on the same reasoning as numpy: already present transitively via
    # FlagEmbedding and sentence-transformers, now a direct import.
    "huggingface-hub",
    "FlagEmbedding",
    "qdrant-client",
    "sentence-transformers",
    "pydantic>=2",
    "fastapi",
    "uvicorn",
    "jinja2",
    "weasyprint",
    "yake",
    "httpx",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
]

[project.scripts]
coursegen = "coursegen.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["coursegen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: marks tests that make real LLM API calls (deselected by default)",
]
